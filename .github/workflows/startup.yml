name: Startup regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.0
      - name: Test options and installer error handling
        run: python3 tests/startup.py
